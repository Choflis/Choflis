<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- small square pattern to create pixel look -->
    <pattern id="px" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1f2430"/>
      <rect x="0" y="0" width="10" height="10" fill="#2b3344"/>
      <rect x="10" y="10" width="10" height="10" fill="#2b3344"/>
      <!-- some color variation for a stylized pixel skyline -->
      <rect x="0" y="10" width="10" height="10" fill="#2d3760" />
      <rect x="10" y="0" width="10" height="10" fill="#3b2a59" />
    </pattern>

    <!-- gradient overlay for depth -->
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#2b1f3a"/>
      <stop offset="60%" stop-color="#1a2b3f"/>
      <stop offset="100%" stop-color="#071226"/>
    </linearGradient>

    <!-- subtle animated light band -->
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="50%" stop-color="rgba(0,200,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- base pixel grid -->
  <rect width="1200" height="300" fill="url(#px)"/>
  <!-- color gradient on top -->
  <rect width="1200" height="300" fill="url(#g)" opacity="0.9"/>
  <!-- animated subtle shine overlay -->
  <rect width="1200" height="300" fill="url(#shine)" opacity="0.5"/>

  <!-- stylized pixel skyline (simple blocks, decorative) -->
  <g transform="translate(40,60)" opacity="0.85">
    <rect x="0" y="80" width="40" height="40" fill="#0f1724"/>
    <rect x="60" y="40" width="60" height="80" fill="#15233a"/>
    <rect x="140" y="20" width="50" height="100" fill="#1a2b3f"/>
    <rect x="210" y="60" width="36" height="60" fill="#23364d"/>
    <rect x="260" y="30" width="90" height="90" fill="#2b3a56"/>
    <rect x="370" y="70" width="50" height="50" fill="#0d1a29"/>
    <rect x="450" y="50" width="80" height="70" fill="#19314a"/>
    <rect x="560" y="20" width="120" height="100" fill="#26354b"/>
    <rect x="700" y="60" width="40" height="40" fill="#10202b"/>
    <rect x="760" y="40" width="90" height="80" fill="#21334b"/>
    <rect x="880" y="20" width="70" height="100" fill="#162332"/>
    <rect x="980" y="60" width="60" height="60" fill="#0f1822"/>
    <!-- small pixel lights -->
    <g fill="#ffd86b" opacity="0.9">
      <rect x="170" y="60" width="6" height="6"/>
      <rect x="185" y="60" width="6" height="6"/>
      <rect x="610" y="80" width="6" height="6"/>
      <rect x="640" y="70" width="6" height="6"/>
      <rect x="920" y="80" width="6" height="6"/>
    </g>
  </g>

  <!-- central text block (kept simple and readable) -->
  <g text-anchor="middle" transform="translate(600,150)">
    <!-- blocky stroke to give a pixel/retro feel -->
    <text x="0" y="-10" font-family="monospace, 'Courier New', monospace" font-size="56" font-weight="700" fill="#ffffff" stroke="#09121a" stroke-width="2" paint-order="stroke">
      Hi, I'm Choflis
    </text>
    <text x="0" y="36" font-family="monospace, 'Courier New', monospace" font-size="16" font-weight="500" fill="#cfe8ff" opacity="0.95">
      Systems Engineering student — Universidad Nacional de San Agustín
    </text>
  </g>

  <!-- bottom code-like line for extra tech vibe -->
  <g transform="translate(40,270)" opacity="0.12" fill="#ffffff" font-family="monospace" font-size="12">
    <text>/* pixel city — code · learn · build */</text>
  </g>
</svg>
